name: Validate Env Sync

on:
  pull_request:
    branches:
      - dev
      - stage
      - main
    paths:
      - '.env.example'
      - 'app/core/config.py'

permissions:
  contents: read

jobs:
  check-env-notice:
    name: Check Env Change Notice
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Summarize changed env keys and verify PR notice
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          changed_files=$(git diff --name-only "$BASE_SHA..$HEAD_SHA")
          echo "Changed config/env files:"
          echo "$changed_files"

          if echo "$changed_files" | grep -q '^\.env\.example$'; then
            echo "::notice::.env.example diff summary:"
            git diff "$BASE_SHA..$HEAD_SHA" -- .env.example | grep -E '^[+-][A-Z0-9_]+=' || true
          fi

          # Check if PR body acknowledges env changes (checked box or explicit .env/환경변수 mention other than default '없음')
          if echo "$PR_BODY" | grep -qiE '\[x\].*환경변수|@'; then
            echo "PR review notice for env changes is present."
            exit 0
          fi

          if echo "$changed_files" | grep -q '^\.env\.example$'; then
            echo "::error::.env.example이 변경되었습니다. PR '리뷰 참고사항'의 환경변수 체크박스를 체크하고 팀원(@멘션)과 필요한 .env 변경 값을 기재해 주세요."
            exit 1
          fi

          echo "::warning::app/core/config.py가 변경되었습니다. 새 환경변수가 추가되었다면 .env.example 업데이트 및 PR 리뷰 참고사항 기재를 확인해 주세요."
