
name: Validate Git Conventions

on:
  pull_request:
    branches:
      - develop
      - stage
      - main

permissions:
  contents: read

jobs:
  validate-branch:
    name: Validate Branch Name
    runs-on: ubuntu-latest

    steps:
      - name: Check branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          pattern='^(feat|fix|docs|chore|release)/#[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'

          if [[ ! "$BRANCH_NAME" =~ $pattern ]]; then
            echo "::error::Invalid branch name: $BRANCH_NAME"
            echo "Expected: feat/#3-login"
            exit 1
          fi

          echo "Branch name is valid."

  validate-commits:
    name: Validate Commit Messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          pattern='^(feat|fix|docs|style|refactor|chore)\(#[0-9]+\): .+$'

          failed=0

          while IFS= read -r message; do
            if [[ ! "$message" =~ $pattern ]]; then
              echo "::error::Invalid commit message: $message"
              echo "Expected: feat(#3): 카카오 소셜 로그인 연동"
              failed=1
            fi
          done < <(git log --format='%s' "$BASE_SHA..$HEAD_SHA")

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

          echo "All commit messages are valid."
